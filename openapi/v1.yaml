          allOf:
          - $ref: '#/components/schemas/VaultImageBehaviour'
          nullable: true
    GenerateResponseSyncResponse:
      type: object
      required:
      - candidates
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ResponseCandidate'
    GetBotResponse:
      type: object
      required:
      - bot
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
    GetChatterResponse:
      type: object
      required:
      - chatter
      properties:
        chatter:
          $ref: '#/components/schemas/Chatter'
    GetClientConfigResponse:
      type: object
      required:
      - config
      properties:
        config:
          $ref: '#/components/schemas/ClientConfig'
    GetConversationResponse:
      type: object
      required:
      - messages
      - bot_id
      - is_typing
      - purchases
      properties:
        bot_id:
          type: string
          format: uuid
          description: ID of the bot associated with this conversation
        freeform:
          type: string
          description: Optional freeform text to add to the prompt
          example: put any information here that you want added to the prompt
          nullable: true
        is_typing:
          type: boolean
          description: Whether the bot is currently preparing a reply (typing indicator)
          example: false
        latest_summary:
          allOf:
          - $ref: '#/components/schemas/Summary'
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Messages in the conversation
        purchases:
          description: Purchases in this conversation, oldest first
          items:
            $ref: '#/components/schemas/APIPurchase'
          type: array
        platform:
          type: string
          description: Optional platform name describing which site the user and bot are chatting on
          example: MyDatingApp
          nullable: true
        segment:
          type: boolean
          description: Whether to have the bot capable of responding in multiple messages (more realistic)
          example: true
          nullable: true
        user_id:
          type: string
          description: ID of the user associated with this conversation
          nullable: true
        webhook:
          type: string
          description: Optional webhook URL to call when messages are received in this conversation
          example: https://example.com/webhook
          nullable: true
    GetMemoriesResponse:
      type: object
      required:
      - bot_memories
      - user_memories
