          type: boolean
          nullable: true
    Summary:
      type: object
      required:
      - summary_text
      - created_at
      - message_count
      properties:
        created_at:
          type: integer
          format: int64
          description: Unix timestamp when the summary was created
          example: 1640995200
        message_count:
          type: integer
          description: Number of messages that were summarized
          example: 10
          minimum: 0
        summary_text:
          type: string
          description: The text summary of the conversation
          example: The conversation started with introductions. The user asked about travel experiences.
      example:
        created_at: 1640995200
        message_count: 10
        summary_text: The conversation started with introductions. The user asked about travel experiences, and the bot shared stories about visiting Europe. They discussed favorite destinations and future travel plans.
    UpdateBotRequest:
      example:
        attributes:
        - name: full_name
          value: Scarlett Jones
        - name: age
          value: '23'
        - name: residence
          value: New York
        freeform: Scarlett loves to travel, she is fresh out of college. Her personality is shy. She enjoys going to fancy restaurants and especially loves tropical destinations. Scarlett's favorite food is cheesecake
        images:
        - public: true
          url: https://example.com/image1.jpg
        - public: false
          url: https://example.com/image2.jpg
        name: Scarlett
      properties:
        attributes:
          description: List of bot attributes
          items:
            $ref: '#/components/schemas/APIAttribute'
          type: array
        bundles:
          nullable: true
          type: boolean
        checkout_link_in_text:
          description: She writes the checkout link in her own message. Needs rails that make links.
          nullable: true
          type: boolean
        discount:
          description: '`hold` or `drop_once`'
          nullable: true
          type: string
        emoji_amount:
          description: 1 to 5
          format: int32
          nullable: true
          type: integer
        first_price_cents:
          example: 900
          format: int64
          nullable: true
          type: integer
        freeform:
          description: Freeform text description
          example: Scarlett loves to travel, she is fresh out of college.
          nullable: true
          type: string
        images:
          description: 'Optional list of images to set for this bot.
    
            When provided, all existing bot images are replaced with these.'
          items:
            $ref: '#/components/schemas/ImageItem'
          nullable: true
          type: array
        max_price_cents:
          description: Highest price she may ask, in USD cents, at most 70000.
          example: 4900
          format: int64
          nullable: true
          type: integer
        message_length:
          description: 1 to 5
          format: int32
          nullable: true
          type: integer
        min_price_cents:
          description: Lowest price she may ask, in USD cents. Set with `max_price_cents` or not at all.
          example: 500
          format: int64
          nullable: true
          type: integer
        name:
          description: Name of the bot
          example: Scarlett
          nullable: true
          type: string
        orientation:
          allOf:
          - $ref: '#/components/schemas/APIOrientation'
          nullable: true
        pace:
          description: '`patient`, `balanced` or `eager`'
          nullable: true
          type: string
        payment_rails:
          description: '`external`. Required when `selling_style` is set.'
          example: external
          nullable: true
          type: string
        personality_shy_bold:
          description: -1 shy to 1 bold
          format: float
          nullable: true
          type: number
        personality_sweet_bratty:
          description: -1 sweet to 1 bratty
          format: float
          nullable: true
          type: number
        price_step_cents:
          example: 500
          format: int64
          nullable: true
          type: integer
        selling_style:
          description: How she sells, in your words. Null turns selling off and clears the selling fields this request does not send.
          example: Playful and warm. She starts with small prices and lets him ask for more.
          nullable: true
          type: string
        voice_enabled:
          description: She may send voice notes
          nullable: true
          type: boolean
        welcome_back_days:
          description: 1 to 60
          format: int32
          nullable: true
          type: integer
      type: object
    UpdateBotResponse:
