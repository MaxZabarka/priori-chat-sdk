        bot_memories:
          type: array
          items:
            $ref: '#/components/schemas/MemoryResponse'
          description: Bot memories for this conversation
        user_memories:
          type: array
          items:
            $ref: '#/components/schemas/MemoryResponse'
          description: User memories for this conversation
    GetPlatformResponse:
      type: object
      required:
      - platform
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
    GetUserResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    ImageItem:
      type: object
      required:
      - url
      - public
      properties:
        new_id:
          type: string
          description: Optional custom content ID for the image
          nullable: true
        public:
          type: boolean
          description: Whether this image is public (displayed on profile) or private (vault)
          example: true
        url:
          type: string
          description: URL of the image (S3 URL for existing content, or external URL for new upload)
          example: https://example.com/image.jpg
      example:
        public: true
        url: https://example.com/image.jpg
    ImageSendingBehaviour:
      type: string
      description: |-
        Controls how frequently the AI sends images in conversation. Stored per-conversation and
        affects whether image tools are exposed to the LLM and how strongly it is prompted to use them.
      enum:
      - disabled
      - low
      - moderate
      - high
      - aggressive
    Language:
      type: string
